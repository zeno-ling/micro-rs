[package]
name = "micro-rs"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "A modern terminal text editor written in Rust, inspired by micro"
repository = "https://github.com/zeno-ling/micro-rs"

[[bin]]
name = "micro-rs"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
regex = "1"
copypasta = "0.10"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "dump-load", "regex-fancy"] }
rhai = { version = "1", features = ["sync"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
